[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmp-model-update-client"
version = "0.1.0"
description = "Reconnectable WebSocket client for graph_modeling_platform model updates"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["."]
